<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accessible Interactive Photo Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>

<body onload="addTabFocus()">

    <h1>Interactive Photo Gallery</h1>

    <div id="image">
        Hover over or focus on an image below to display here.
    </div>

    <div class="gallery">
        <img class="preview"
             src="https://picsum.photos/id/10/300/200"
             alt="Beautiful forest landscape"
             onmouseover="upDate(this)"
             onmouseleave="unDo()"
             onfocus="upDate(this)"
             onblur="unDo()">

        <img class="preview"
             src="https://picsum.photos/id/28/300/200"
             alt="Peaceful mountain landscape"
             onmouseover="upDate(this)"
             onmouseleave="unDo()"
             onfocus="upDate(this)"
             onblur="unDo()">

        <img class="preview"
             src="https://picsum.photos/id/29/300/200"
             alt="Beautiful natural scenery"
             onmouseover="upDate(this)"
             onmouseleave="unDo()"
             onfocus="upDate(this)"
             onblur="unDo()">

        <img class="preview"
             src="https://picsum.photos/id/15/300/200"
             alt="River surrounded by nature"
             onmouseover="upDate(this)"
             onmouseleave="unDo()"
             onfocus="upDate(this)"
             onblur="unDo()">

        <img class="preview"
             src="https://picsum.photos/id/16/300/200"
             alt="Calm ocean landscape"
             onmouseover="upDate(this)"
             onmouseleave="unDo()"
             onfocus="upDate(this)"
             onblur="unDo()">

        <img class="preview"
             src="https://picsum.photos/id/17/300/200"
             alt="Scenic countryside view"
             onmouseover="upDate(this)"
             onmouseleave="unDo()"
             onfocus="upDate(this)"
             onblur="unDo()">
    </div>

    <script src="script.js"></script>
</body>
</html>
